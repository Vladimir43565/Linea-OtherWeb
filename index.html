<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linea — Website to HTML</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #08090d;
    color: white;
    font-family: Arial, sans-serif;
}

    padding: 25px 35px;

    font-weight: 800;

}

    width: min(1000px, calc(100% - 40px));
    margin: 100px auto;
}

.hero {
    text-align: center;
    margin-bottom: 45px;
}

.badge {
    display: inline-block;
    padding: 8px 14px;
    border: 1px solid #292b39;
    border-radius: 999px;
    background: #11121a;

}

h1 {
    font-size: clamp(45px, 8vw, 75px);
    letter-spacing: -4px;
    margin: 0 0 20px;
}

    color: #8586ff;
}

.hero p {
    color: #92949f;

}

.box {
    background: #101117;

label {

</head>

<body>

<header>
    Line<span>a</span>
</header>

<main>

<section class="hero">

    <div class="badge">
        🌐 Website → HTML
    </div>

    <h1>
        Turn a website<br>
        <span>into HTML.</span>
    </h1>

    <p>
        Paste a public website URL and Linea will retrieve
        its HTML and prepare it for download.
    </p>

</section>


<section class="box">

    <label for="url">
        Website URL
    </label>

    <div class="input-row">

        <input
            id="url"
            type="url"
            placeholder="https://example.com"
        >

        <button id="convert">
            Convert
        </button>

    </div>


    <div id="status" class="status"></div>


    <div id="result" class="result">

        <div class="result-top">

            <strong>
                Generated HTML
            </strong>

            <div class="actions">

                <button
                    class="small"
                    id="copy"
                >
                    Copy
                </button>

                <button
                    class="small"
                    id="download"
                >
                    Download
                </button>

                <button
                    class="small"
                    id="previewButton"
                >
                    Preview
                </button>

            </div>

        </div>

        <textarea
            id="output"
            readonly
            spellcheck="false"
        ></textarea>

    </div>


    <div id="preview" class="preview">

        <iframe
            id="frame"
            sandbox="allow-scripts"
        ></iframe>

    </div>

</section>

</main>


<script>

const API_URL = "https://YOUR-BACKEND-DOMAIN.com/api/convert";

const urlInput = document.getElementById("url");
const convert = document.getElementById("convert");
const status = document.getElementById("status");
const result = document.getElementById("result");
const output = document.getElementById("output");

const copy = document.getElementById("copy");
const download = document.getElementById("download");
const previewButton = document.getElementById("previewButton");

const preview = document.getElementById("preview");
const frame = document.getElementById("frame");


function showStatus(message) {
    status.textContent = message;
    status.classList.add("show");
}


function normalizeURL(value) {

    value = value.trim();

    if (!value) {
        return null;
    }

    if (!/^https?:\/\//i.test(value)) {
        value = "https://" + value;
    }

    try {
        return new URL(value).href;
    } catch {
        return null;
    }
}


convert.addEventListener("click", async () => {

    const url = normalizeURL(urlInput.value);

    if (!url) {
        showStatus("❌ Enter a valid website URL.");
        return;
    }

    convert.disabled = true;
    convert.textContent = "Converting...";

    result.classList.remove("show");
    preview.classList.remove("show");

    showStatus("⏳ Fetching website...");

    try {

        const response = await fetch(
            API_URL + "?url=" + encodeURIComponent(url)
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error || "Conversion failed."
            );
        }

        output.value = data.html;

        result.classList.add("show");

        showStatus(
            "✅ Website converted successfully."
        );

    } catch (error) {

        showStatus(
            "❌ " + error.message
        );

    } finally {

        convert.disabled = false;
        convert.textContent = "Convert";

    }

});


urlInput.addEventListener("keydown", event => {

    if (event.key === "Enter") {
        convert.click();
    }

});


copy.addEventListener("click", async () => {

    await navigator.clipboard.writeText(
        output.value
    );

    copy.textContent = "Copied ✓";

    setTimeout(() => {
        copy.textContent = "Copy";
    }, 1500);

});


download.addEventListener("click", () => {

    const blob = new Blob(
        [output.value],
        { type: "text/html" }
    );

    const link = document.createElement("a");

    link.href = URL.createObjectURL(blob);
    link.download = "linea-converted.html";

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(link.href);

});


previewButton.addEventListener("click", () => {

    frame.srcdoc = output.value;

    preview.classList.add("show");

    preview.scrollIntoView({
        behavior: "smooth"
    });

});

</script>

</body>
</html>
